name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Database security rules (RLS on real Postgres)
        run: npm run test:db
      - name: Backend server API (real HTTP, three users)
        run: npm run test:api
      - run: npm run build
      # The parity fixture is regenerated by `npm test`. If it changed, features.ts changed
      # without features.py being updated to match — fail loudly rather than letting the two
      # drift, because nothing downstream would catch it.
      - name: Fail if the parity fixture drifted
        run: git diff --exit-code -- services/ml/fixtures/parity.json

  parity:
    name: Feature parity (TS vs Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: pip install numpy
      # Regenerate the fixture from the TypeScript implementation, then assert Python agrees.
      - run: npm test --workspace @signsphere/web
      - run: python check_parity.py
        working-directory: services/ml

  ml:
    name: Training pipeline (synthetic data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and ONNX tools
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy onnx onnxscript onnxruntime
      # Made-up data, only to prove train.py runs end to end and exports a model the app can
      # load. It says nothing about real ISL accuracy.
      - name: Train on synthetic data and check the exported model
        working-directory: services/ml
        run: |
          python synthetic.py --out /tmp/synthetic.jsonl
          python train.py --data /tmp/synthetic.jsonl --model linear --epochs 3 --out /tmp/models
          python train.py --data /tmp/synthetic.jsonl --model cnn --epochs 3 --out /tmp/models
          python check_model.py /tmp/models/sign-linear-v1.onnx
          python check_model.py /tmp/models/sign-cnn-v1.onnx

  docker:
    name: Server image builds and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t signsphere .
      - name: Run it and check the health endpoint and the app
        run: |
          docker run -d --name ss -p 8787:8787 signsphere
          for i in $(seq 1 30); do curl -fsS localhost:8787/api/health && break; sleep 2; done
          curl -fsS localhost:8787/api/health
          curl -fsS -o /dev/null -w "%{http_code} %{content_type}\n" localhost:8787/emergency | grep -q "200 text/html"
          docker logs ss | tail -5

name: Android release (Play Store)

# Builds a signed Android App Bundle (.aab) for Google Play.
# Run it from Actions → "Android release (Play Store)" → Run workflow, or push a tag like v1.0.0.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your upload keystore (.jks)   — required
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD — required
#   PLAY_SERVICE_ACCOUNT_JSON  Google Play service-account key        — optional: uploads to a track
# Repository variables: VITE_API_URL (your server, docs/DEPLOY.md) or the Supabase pair.
# See docs/STORE_RELEASE.md.

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to upload to (needs PLAY_SERVICE_ACCOUNT_JSON)'
        type: choice
        options: [none, internal, alpha, beta, production]
        default: internal
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Check the signing secrets are set
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64 and the password secrets first — see docs/STORE_RELEASE.md"
            exit 1
          fi
      - name: Build the app for Android
        env:
          VITE_NATIVE: '1'
          VITE_PUBLIC_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
        run: |
          if [ -z "$VITE_API_URL$VITE_SUPABASE_URL" ]; then echo "::warning::No server set (VITE_API_URL) — this build keeps data only on the phone."; fi
          npm run build
      - name: Copy into the Android project
        working-directory: apps/web
        run: npx cap sync android
      - name: Build signed AAB
        working-directory: apps/web/android
        env:
          SIGNSPHERE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNSPHERE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNSPHERE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export SIGNSPHERE_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          # Every Play upload needs a higher versionCode; the run number always goes up.
          export SIGNSPHERE_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          export SIGNSPHERE_VERSION_NAME="$(node -p "require('../package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export SIGNSPHERE_VERSION_NAME="${GITHUB_REF_NAME#v}"; fi
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/SignSphere.aab"
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: SignSphere-aab
          path: SignSphere.aab
      - name: Upload to Google Play
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.track != 'none' && env.PLAY_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: in.signsphere.app
          releaseFiles: SignSphere.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.track == 'production' && 'draft' || 'completed' }}
